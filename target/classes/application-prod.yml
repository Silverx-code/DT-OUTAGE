spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt-secret: ${JWT_SECRET}
  frontend-url: ${FRONTEND_URL}

logging:
  level:
    org.springframework.security: WARN
    com.gridline.dtoutage: INFO
