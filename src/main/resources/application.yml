spring:
  application:
    name: dt-outage-reporting

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dt_outage}
    username: ${DB_USERNAME:dt_outage_app}
    password: ${DB_PASSWORD:changeme}
    hikari:
      # A conservative default for managed PostgreSQL poolers such as Supabase.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate only validates it matches the
      # entity mappings, it never auto-generates or alters tables.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render provides PORT; SERVER_PORT remains available for local deployments.
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

logging:
  level:
    org.springframework.security: INFO
    com.gridline.dtoutage: INFO

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@gridline.local}

spring.mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties.mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
  properties.mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
